<section class="bg-yellow-100 p-4 text-center font-bold">
  {{ 'home.discount' | translate }}
</section>
<app-hero></app-hero>

<section class="max-w-7xl mx-auto px-4 py-10">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800 border-l-4 border-yellow-400 pl-4">
      {{ 'home.categories' | translate }}
    </h2>
    <a routerLink="/produtos" class="text-sm font-semibold text-blue-600 hover:underline">{{ 'home.exploreCatalog' | translate }}</a>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
    @for (category of categories(); track category.slug) {
      <a
        [routerLink]="['/categoria', category.slug]"
        class="bg-white rounded-xl border border-gray-100 p-5 text-center shadow-sm hover:shadow-lg hover:border-yellow-400 transition"
      >
        <div class="w-12 h-12 mx-auto rounded-lg bg-yellow-100 text-yellow-600 flex items-center justify-center text-xl">
          <i [class]="category.icon"></i>
        </div>
        <h3 class="text-sm font-extrabold text-gray-800 mt-4">{{ category.label }}</h3>
      </a>
    }
  </div>
</section>

<app-product-list></app-product-list>

<app-product-list [title]="'home.newArrivals' | translate" [products]="newProducts()" [showHeaderLink]="false" [autoLoad]="false"></app-product-list>
