
    <header class="w-full bg-white shadow-sm border-b-2 border-yellow-400">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-8">
            
            <a routerLink="/" class="flex items-center gap-2 min-w-fit">
                <div class="bg-yellow-400 p-2 rounded-lg">
                    <i class="fa-solid fa-cart-shopping text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold leading-none">Mini<span class="text-yellow-500">Shop</span></h1>
                    <p class="text-[10px] text-gray-500 uppercase tracking-tighter">Tudo que você precisa</p>
                </div>
            </a>

            <div class="flex-1 flex items-center border rounded-md overflow-hidden">
                <input type="text" placeholder="Pesquisar produtos, marcas e muito mais..." class="flex-1 px-4 py-2 outline-none text-sm">
                <a routerLink="/produtos" class="bg-yellow-400 px-5 py-2 hover:bg-yellow-500 transition" aria-label="Pesquisar produtos">
                    <i class="fa-solid fa-magnifying-glass text-gray-800"></i>
                </a>
            </div>

            <div class="flex items-center gap-6 min-w-fit text-sm text-gray-700">
                <button
                    (click)="theme.toggleTheme()"
                    class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center hover:bg-yellow-100 hover:text-yellow-700 transition"
                    [attr.aria-label]="theme.mode() === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro'"
                    [title]="theme.mode() === 'dark' ? 'Modo claro' : 'Modo escuro'"
                >
                    @if (theme.mode() === 'dark') {
                        <i class="fa-solid fa-sun text-lg"></i>
                    } @else {
                        <i class="fa-solid fa-moon text-lg"></i>
                    }
                </button>

                <a routerLink="/conta" class="flex items-center gap-2 cursor-pointer hover:text-yellow-600 transition">
                    <i class="fa-regular fa-user text-2xl"></i>
                    <div>
                        <p class="text-[11px] leading-none">{{ auth.isLoggedIn() ? 'Olá' : 'Entrar' }}</p>
                        <p class="font-bold flex items-center gap-1">{{ auth.isLoggedIn() ? auth.user()?.name : 'Minha conta' }} <i class="fa-solid fa-chevron-down text-[8px]"></i></p>
                    </div>
                </a>

                <a routerLink="/pedidos" class="hidden lg:flex items-center gap-2 hover:text-yellow-600 transition">
                    <i class="fa-solid fa-box text-xl"></i>
                    <span class="font-bold">Meus pedidos</span>
                </a>
                
                <a routerLink="/carrinho" class="relative cursor-pointer" aria-label="Carrinho">
                    <i class="fa-solid fa-cart-shopping text-2xl text-gray-600"></i>
                    <span class="absolute -top-2 -right-2 bg-yellow-400 text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white">{{ cart.totalItems() }}</span>
                </a>
            </div>
        </div>

        <nav class="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between">
            <div class="flex items-center gap-6 text-[13px] font-medium text-gray-600 overflow-x-auto pb-1">
                <a routerLink="/produtos" class="flex items-center gap-2 font-bold text-gray-800 hover:text-yellow-600 min-w-fit">
                    <i class="fa-solid fa-bars"></i> Todas as categorias
                </a>
                @for (link of menuLinks; track link.url) {
                    <a [routerLink]="link.url" class="hover:text-yellow-600 transition min-w-fit">{{ link.label }}</a>
                }
            </div>
        </nav>
    </header>
